<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-labelledby="title desc">
  <title id="title">NexaSpark</title>
  <desc id="desc">NexaSpark mark: spark over a stylized letter N</desc>
  <defs>
    <linearGradient id="nx-bg" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#1a5fd4"/>
      <stop offset="55%" stop-color="#2874f0"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="nx-spark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="50%" stop-color="#ffc200"/>
      <stop offset="100%" stop-color="#fff8e1"/>
    </linearGradient>
    <filter id="nx-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="72" height="72" rx="18" fill="url(#nx-bg)"/>
  <path fill="#ffffff" fill-opacity="0.12" d="M18 54c8-6 14-14 18-24s6-18 6-28h8c0 12-4 24-12 34s-18 16-30 18h10z"/>
  <path fill="#ffffff" d="M20 50V20h9l13 20V20h10v30h-9L30 30v20H20z"/>
  <g filter="url(#nx-soft)">
    <path
      fill="url(#nx-spark)"
      d="M54 6l2.2 6.5 6.8 0.5-5.2 4.2 1.8 6.6-5.6-3.4-5.6 3.4 1.8-6.6-5.2-4.2 6.8-0.5z"
    />
  </g>
  <circle cx="54" cy="14" r="2" fill="#fff9c4" opacity="0.9"/>
</svg>
