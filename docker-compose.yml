services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - nexaspark_mongo:/data/db

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      PORT: '4000'
      MONGODB_URI: mongodb://mongo:27017/nexaspark
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://127.0.0.1:8080}
      JWT_SECRET: ${JWT_SECRET:-docker-dev-only-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DEFAULT_COUNTRY: ${DEFAULT_COUNTRY:-IN}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-INR}
      LOCALE: ${LOCALE:-en-IN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      - mongo

volumes:
  nexaspark_mongo:
