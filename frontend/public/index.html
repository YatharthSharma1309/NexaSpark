<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NexaSpark — Electronics</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">NexaSpark</div>
      <p class="tagline">Electronics storefront (scaffold)</p>
    </header>
    <main class="main">
      <section class="card">
        <h1>Welcome</h1>
        <p>
          Static shell for the web UI. Point the API at <code>/api/health</code> on the backend
          (default <code>http://127.0.0.1:4000</code>).
        </p>
        <p>
          <button type="button" id="health-check">Check API health</button>
        </p>
        <pre id="health-output" class="output" hidden></pre>
      </section>
      <nav class="legal">
        <a href="/privacy.html">Privacy</a>
        <a href="/terms.html">Terms</a>
      </nav>
    </main>
    <script src="/js/app.js" type="module"></script>
