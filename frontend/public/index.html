<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce Store</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Modern Store</h1>
      <div class="auth-status">
        <span id="userStatus">Guest</span>
        <button id="logoutBtn" class="ghost-btn" hidden>Logout</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <section>
          <h2>Search & Filters</h2>
          <input id="searchInput" type="text" placeholder="Search products..." />
          <select id="categoryInput">
            <option value="">All categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Accessories">Accessories</option>
            <option value="Furniture">Furniture</option>
          </select>
          <input id="minPriceInput" type="number" min="0" placeholder="Min price" />
          <input id="maxPriceInput" type="number" min="0" placeholder="Max price" />
          <select id="sortInput">
            <option value="">Newest</option>
            <option value="price_asc">Price: Low to high</option>
            <option value="price_desc">Price: High to low</option>
            <option value="rating_desc">Top rated</option>
          </select>
          <button id="applyFiltersBtn">Apply</button>
        </section>

        <section>
          <h2>Auth</h2>
          <form id="signupForm">
            <h3>Sign up</h3>
            <input name="name" placeholder="Name" required />
            <input name="email" type="email" placeholder="Email" required />
            <input name="password" type="password" placeholder="Password" required minlength="6" />
            <button type="submit">Create account</button>
          </form>
          <form id="loginForm">
            <h3>Log in</h3>
            <input name="email" type="email" placeholder="Email" required />
            <input name="password" type="password" placeholder="Password" required />
            <button type="submit">Log in</button>
          </form>
        </section>
      </aside>

      <section class="content">
        <div class="toolbar">
          <h2>Products</h2>
          <button id="refreshBtn" class="ghost-btn">Refresh</button>
        </div>
        <p id="feedback"></p>
        <div id="productsGrid" class="grid"></div>
        <div class="pagination">
          <button id="prevBtn" class="ghost-btn">Prev</button>
          <span id="pageInfo">Page 1</span>
          <button id="nextBtn" class="ghost-btn">Next</button>
        </div>

        <div class="panels">
          <article class="panel">
            <div class="panel-header">
              <h3>Cart</h3>
              <button id="loadCartBtn" class="ghost-btn">Load cart</button>
            </div>
            <ul id="cartItems"></ul>
            <button id="checkoutBtn">Checkout</button>
          </article>

          <article class="panel">
            <div class="panel-header">
              <h3>Orders</h3>
              <button id="loadOrdersBtn" class="ghost-btn">Load orders</button>
            </div>
            <ul id="orderItems"></ul>
          </article>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
